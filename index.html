<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor Challenge | Order summary card</title>

    <style>
      :root {
        --blue-100: hsl(225, 100%, 94%);
        --blue-700: hsl(245, 75%, 52%);
        --blue-50: hsl(225, 100%, 98%);
        --gray-600: hsl(224, 23%, 55%);
        --blue-950: hsl(223, 47%, 23%);
        --light-blue-hover: hsl(245, 75%, 65%);
        --white: hsl(0, 0%, 100%);
        --shadow: rgb(166, 174, 214);
        --font-family: "Red Hat Display", sans-serif;
        --font-size: 16px;
        --font-weight-regular: 500;
        --font-weight-semi-bold: 700;
        --font-weight-bold: 900;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: var(--font-family);
        font-size: var(--font-size);
        font-weight: var(--font-weight-regular);
        color: var(--gray-600);
      }

      body {
        width: 100%;
        height: 100%;
        background-image: url("assets/images/pattern-background-mobile.svg");
        background-repeat: no-repeat;
        background-size: cover;
        background-color: var(--blue-100);
      }

      button:hover {
        cursor: pointer;
      }

      main {
        width: 327px;
        height: 567px;
        background-color: var(--white);
        border-radius: 20px;

        position: absolute;
        top: 50%;
        left: 50%;
        translate: -50% -50%;

        display: grid;
        grid-template-columns: 100%;
        grid-template-rows: 160px calc(100% - 160px);

        transition: all 0.3s ease;

        box-shadow: 10px 10px 30px var(--shadow);

        section.card-cover {
          width: 100%;
          height: 100%;
          background-image: url("assets/images/illustration-hero.svg");
          background-position: center;
          background-repeat: no-repeat;
          background-size: cover;
          border-radius: 20px 20px 0 0;
        }

        section.card-info {
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          text-align: center;
          padding: 30px 24px 32px 24px;
          line-height: 1.5;

          h1 {
            font-weight: var(--font-weight-bold);
            font-size: 1.4rem;
            letter-spacing: -0.2px;
            color: var(--blue-950);
            margin-bottom: 10px;
          }

          p.description {
            padding: 0 14px;
            letter-spacing: -0.37px;
            line-height: 1.6;
            margin-bottom: 20px;
          }

          .plan-card {
            width: 100%;
            height: 80px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 16px;
            border-radius: 10px;
            margin-bottom: 20px;

            background-color: var(--blue-50);

            .plan-info {
              display: flex;
              align-items: center;
              gap: 20px;
              line-height: 1.6;
              letter-spacing: 0.1px;

              p.plan-type {
                font-weight: var(--font-weight-semi-bold);
                color: var(--blue-950);
                font-size: 0.9rem;
              }

              p.plan-price {
                font-size: 0.88rem;
              }
            }

            button.plan-change {
              color: var(--blue-700);
              text-decoration: underline;
              font-size: 0.82rem;
              font-weight: var(--font-weight-semi-bold);
            }

            button.plan-change:hover {
              text-decoration: none;
              color: var(--light-blue-hover);
            }
          }

          button {
            border: none;
            outline: none;
            background: none;
            font-weight: var(--font-weight-semi-bold);
          }

          button.proceed-payment {
            width: 100%;
            height: 50px;
            background-color: var(--blue-700);
            color: var(--blue-50);
            border-radius: 10px;
            margin-bottom: 21px;
            box-shadow: 10px 10px 20px var(--shadow);
          }

          button.proceed-payment:hover {
            background-color: var(--light-blue-hover);
            cursor: pointer;
          }

          button.cancel-order:hover {
            color: var(--blue-950);
          }
        }
      }

      footer {
        font-size: 9px;
        text-align: center;

        position: absolute;
        bottom: 10px;
        left: 50%;
        translate: -50% -50%;
        color: var(--gray-600);
      }

      footer a {
        font-size: 9px;
        text-decoration: none;
        color: var(--blue-700);
        font-weight: var(--font-weight-semi-bold);
      }

      #temp {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        object-fit: cover;
        opacity: 0.5;
        pointer-events: none;
        z-index: 9999;
      }

      @media (min-width: 1440px) {
        body {
          background-image: url("assets/images/pattern-background-desktop.svg");
        }

        main {
          width: 450px;
          height: 697px;

          grid-template-rows: 220px calc(100% - 220px);

          section.card-info {
            padding: 45px 48px 48px 48px;

            h1 {
              font-size: 1.7rem;
              letter-spacing: 0.5px;
              margin-bottom: 13px;
            }

            p.description {
              font-size: 1.07rem;
              line-height: 1.56;
            }

            .plan-card {
              height: 98px;
              margin-bottom: 32px;
              padding: 0 24px;

              .plan-info {
                line-height: 1.7;
                padding-bottom: 5px;
                gap: 19px;

                p.plan-type {
                  font-size: 1rem;
                  font-weight: var(--font-weight-bold);
                }

                p.plan-price {
                  font-size: 0.99rem;
                }
              }

              button.plan-change {
                font-size: 0.9rem;
                padding-bottom: 5px;
              }
            }

            button.proceed-payment {
              margin-bottom: 31px;
            }
          }
        }
      }
    </style>
  </head>
  <body>
    <!-- <img src="design/desktop-design.jpg" alt="Design" id="temp" /> -->
    <div class="container">
      <main>
        <section class="card-cover"></section>
        <section class="card-info">
          <h1>Order Summary</h1>
          <p class="description">
            You can now listen to millions of songs, audiobooks, and podcasts on
            any device anywhere you like!
          </p>
          <div class="plan-card">
            <div class="plan-info">
              <img src="assets/images/icon-music.svg" alt="Music icon" />
              <div class="plan-detail">
                <p class="plan-type">Annual Plan</p>
                <p class="plan-price">$59.99/year</p>
              </div>
            </div>
            <button class="plan-change">Change</button>
          </div>
          <button class="proceed-payment">Proceed to Payment</button>
          <button class="cancel-order">Cancel Order</button>
        </section>
      </main>
      <footer class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. <br />Coded by
        <a href="https://github.com/VangmanawKairung">Kairung Vangmanaw</a>.
      </footer>
    </div>
  </body>
</html>
